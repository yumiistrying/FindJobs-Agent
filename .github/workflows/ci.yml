name: FindJobs-Agent CI & Daily Crawler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每天 UTC 时间 01:30 触发 (对应本地时间 09:30)
    - cron: '30 1 * * *'
  workflow_dispatch: 

jobs:
  backend-and-crawler:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest requests
          pip install -r requirements.txt

      - name: Create API Key File
        run: echo "${{ secrets.GEMINI_API_KEY }}" > API_key-openai.md

      - name: Run Daily Crawler Pipeline
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python pipeline.py

      - name: Commit and Push Data
        # always() 确保就算没抓到新数据报错，这一步也会执行；后面限制了只在手动或定时任务时运行
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 使用 -A 自动添加所有新增、修改或删除的文件，无视具体文件名
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update job data" && git push) || echo "No changes to commit"

      - name: Send Telegram Notification
        # 同样确保无论成功失败都会给你发消息汇报
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python send_tg.py
